[project]
name = "marketopinion"
version = "0.1.0"
description = "The opinion articles of Market Hub: written here, checked here and published to the portal."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-firestore>=2.34.0",
    "google-cloud-storage>=2.18",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
