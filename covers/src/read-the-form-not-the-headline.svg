<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif">
  <!-- A poster in three inks: the shouting strip of a headline, and under the glass, the form. -->
  <defs>
    <clipPath id="lens"><circle cx="1050" cy="580" r="222"/></clipPath>
    <clipPath id="page"><rect width="1600" height="900"/></clipPath>
    <filter id="ink" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="5" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.9  0 0 0 0 0.83  0 0 0 -1.8 0.66" result="rub"/>
      <feComposite in="rub" in2="SourceGraphic" operator="in" result="worn"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="worn"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#ece5d3"/>
  <g clip-path="url(#page)" filter="url(#ink)">
    <!-- the wedge and the bar: red against black -->
    <path d="M0 0H760L250 900H0Z" fill="#d3251c"/>
    <path d="M1600 900H1180L1600 320Z" fill="#161412"/>
    <circle cx="210" cy="690" r="120" fill="#161412"/>
    <circle cx="210" cy="690" r="62" fill="#ece5d3"/>

    <!-- the headline: big, tilted, and struck through -->
    <g transform="rotate(-14 520 250)">
      <rect x="-80" y="176" width="900" height="150" fill="#161412"/>
      <text x="-34" y="290" font-size="112" fill="#ece5d3" letter-spacing="-2">SHARES JUMP</text>
      <rect x="-80" y="240" width="900" height="18" fill="#d3251c"/>
    </g>

    <!-- the form, a sheet set square on the page -->
    <g transform="rotate(4 1010 500)">
      <rect x="700" y="170" width="640" height="700" fill="#f8f4ea" stroke="#161412" stroke-width="6"/>
      <rect x="700" y="170" width="640" height="92" fill="#161412"/>
      <text x="728" y="236" font-size="58" fill="#f8f4ea" letter-spacing="2">FORM 8-K</text>
      <g fill="#161412" fill-opacity="0.28">
        <rect x="736" y="300" width="560" height="12"/><rect x="736" y="328" width="500" height="12"/><rect x="736" y="356" width="540" height="12"/>
        <rect x="736" y="420" width="560" height="12"/><rect x="736" y="448" width="420" height="12"/><rect x="736" y="476" width="520" height="12"/><rect x="736" y="504" width="470" height="12"/>
        <rect x="736" y="568" width="560" height="12"/><rect x="736" y="596" width="510" height="12"/><rect x="736" y="624" width="380" height="12"/>
        <rect x="736" y="688" width="560" height="12"/><rect x="736" y="716" width="450" height="12"/><rect x="736" y="744" width="530" height="12"/><rect x="736" y="772" width="300" height="12"/>
      </g>
    </g>

    <!-- under the glass the same sheet, large enough to read -->
    <circle cx="1050" cy="580" r="222" fill="#f8f4ea"/>
    <g clip-path="url(#lens)">
      <g transform="rotate(4 1010 500)" fill="#161412">
        <rect x="880" y="420" width="250" height="60" fill="#d3251c"/>
        <text x="896" y="466" font-size="42" fill="#f8f4ea">ITEM 2.02</text>
        <rect x="800" y="508" width="560" height="20"/><rect x="800" y="548" width="470" height="20"/><rect x="800" y="588" width="520" height="20"/>
        <rect x="880" y="644" width="250" height="60"/>
        <text x="896" y="690" font-size="42" fill="#f8f4ea">ITEM 7.01</text>
        <rect x="800" y="732" width="540" height="20"/><rect x="800" y="772" width="400" height="20"/>
      </g>
    </g>
    <!-- the glass itself -->
    <circle cx="1050" cy="580" r="222" fill="none" stroke="#161412" stroke-width="30"/>
    <circle cx="1050" cy="580" r="240" fill="none" stroke="#d3251c" stroke-width="8"/>
    <path d="M1222 742l230 190" stroke="#161412" stroke-width="64" stroke-linecap="round"/>
    <path d="M1250 766l190 158" stroke="#d3251c" stroke-width="14" stroke-linecap="round"/>
    <path d="M908 486a164 164 0 0 1 116-84" fill="none" stroke="#161412" stroke-opacity="0.22" stroke-width="16" stroke-linecap="round"/>

    <!-- the small furniture of a poster -->
    <g fill="#161412"><rect x="60" y="820" width="330" height="14"/><rect x="60" y="846" width="210" height="14"/></g>
    <g fill="#ece5d3"><rect x="60" y="56" width="16" height="120"/><rect x="88" y="56" width="16" height="80"/><rect x="116" y="56" width="16" height="40"/></g>
  </g>
</svg>
