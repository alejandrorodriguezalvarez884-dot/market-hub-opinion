<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- Screen-printed travel poster, four inks out of register: a towering petrol pump glows orange
       over a long road to the horizon, and far below it a tortoise carrying a small house on its
       shell walks steadily on. The loud thing and the slow thing. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="14" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0.55 -0.18"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="5"/>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3.2" fill="#e9b24a"/>
    </pattern>
    <pattern id="dotsSmall" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.8" fill="#1f3a4d" opacity="0.5"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f08a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f08a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky and sun -->
  <rect width="1600" height="900" fill="#f1e6cf"/>
  <circle cx="1180" cy="300" r="190" fill="url(#dots)"/>
  <circle cx="1180" cy="300" r="190" fill="none" stroke="#e9b24a" stroke-width="6"/>

  <!-- far hills -->
  <path d="M0 560 C 220 500, 380 520, 560 548 S 900 500, 1100 530 S 1420 505, 1600 540 L1600 900 L0 900 Z" fill="#7aa6a1"/>
  <path d="M0 610 C 260 575, 520 600, 760 612 S 1260 585, 1600 605 L1600 900 L0 900 Z" fill="#4f8582"/>

  <!-- ground and road to the horizon -->
  <rect y="640" width="1600" height="260" fill="#d9c9a4"/>
  <rect y="640" width="1600" height="260" fill="url(#dotsSmall)" opacity="0.35"/>
  <path d="M1010 640 L1060 640 L1420 900 L700 900 Z" fill="#1f3a4d"/>
  <g fill="#f1e6cf">
    <path d="M1033 656 L1039 656 L1046 690 L1036 690 Z"/>
    <path d="M1047 720 L1058 720 L1073 790 L1055 790 Z"/>
    <path d="M1071 836 L1088 836 L1104 900 L1080 900 Z"/>
  </g>

  <!-- the pump: tall, loud, lit -->
  <ellipse cx="420" cy="430" rx="360" ry="420" fill="url(#glow)"/>
  <g filter="url(#rough)">
    <!-- misregistered shadow plate -->
    <path d="M262 120 Q262 92 290 92 L546 92 Q574 92 574 120 L574 828 L262 828 Z" fill="#1f3a4d" transform="translate(14 10)"/>
    <path d="M262 120 Q262 92 290 92 L546 92 Q574 92 574 120 L574 828 L262 828 Z" fill="#e2622b"/>
    <rect x="236" y="828" width="364" height="34" rx="6" fill="#1f3a4d"/>
    <!-- the dial, spinning: ticks and a needle, no numbers -->
    <circle cx="418" cy="250" r="104" fill="#f1e6cf"/>
    <circle cx="418" cy="250" r="104" fill="none" stroke="#1f3a4d" stroke-width="10"/>
    <g stroke="#1f3a4d" stroke-width="6" stroke-linecap="round">
      <path d="M418 160 L418 182"/><path d="M482 186 L467 201"/><path d="M508 250 L486 250"/>
      <path d="M482 314 L467 299"/><path d="M354 186 L369 201"/><path d="M328 250 L350 250"/>
      <path d="M354 314 L369 299"/>
    </g>
    <path d="M418 250 L486 196" stroke="#e2622b" stroke-width="9" stroke-linecap="round"/>
    <circle cx="418" cy="250" r="13" fill="#1f3a4d"/>
    <!-- motion strokes around the dial -->
    <g fill="none" stroke="#f1e6cf" stroke-width="7" stroke-linecap="round">
      <path d="M296 150 A150 150 0 0 1 380 104"/>
      <path d="M540 350 A150 150 0 0 1 456 396"/>
    </g>
    <!-- the window and the hose -->
    <rect x="312" y="420" width="212" height="120" rx="10" fill="#1f3a4d"/>
    <rect x="332" y="440" width="172" height="80" rx="6" fill="#e9b24a"/>
    <path d="M574 470 C 690 470, 700 640, 640 700 S 600 800, 660 820" fill="none" stroke="#1f3a4d" stroke-width="22" stroke-linecap="round"/>
    <path d="M552 600 L612 600 L612 690 L586 690 L586 640 L552 640 Z" fill="#1f3a4d"/>
    <rect x="300" y="600" width="236" height="16" fill="#f1e6cf" opacity="0.8"/>
    <rect x="300" y="640" width="236" height="16" fill="#f1e6cf" opacity="0.8"/>
  </g>

  <!-- the tortoise: small, low, steady, with its house -->
  <g filter="url(#rough)" transform="translate(1160 770) scale(1.1)">
    <ellipse cx="6" cy="70" rx="140" ry="16" fill="#1f3a4d" opacity="0.25"/>
    <!-- legs and head -->
    <g fill="#a9c8b8">
      <rect x="-92" y="34" width="34" height="38" rx="12"/>
      <rect x="54" y="34" width="34" height="38" rx="12"/>
      <rect x="-40" y="40" width="30" height="32" rx="12"/>
      <path d="M100 20 C 140 6, 176 18, 176 40 C 176 58, 150 62, 122 52 Z"/>
    </g>
    <circle cx="158" cy="32" r="5" fill="#1f3a4d"/>
    <!-- the shell, plate out of register -->
    <path d="M-120 46 C -120 -40, 120 -40, 120 46 Z" fill="#e2622b" transform="translate(7 5)"/>
    <path d="M-120 46 C -120 -40, 120 -40, 120 46 Z" fill="#7aa6a1"/>
    <g fill="none" stroke="#1f3a4d" stroke-width="5">
      <path d="M-60 44 C -60 0, 60 0, 60 44"/>
      <path d="M0 -20 L0 44"/>
      <path d="M-100 20 L100 20"/>
    </g>
    <!-- the house on its back -->
    <g transform="translate(-40 -112)">
      <rect x="6" y="40" width="70" height="52" fill="#f1e6cf"/>
      <path d="M-4 44 L41 6 L86 44 Z" fill="#e2622b"/>
      <rect x="58" y="10" width="12" height="24" fill="#1f3a4d"/>
      <rect x="32" y="62" width="18" height="30" fill="#1f3a4d"/>
      <rect x="14" y="52" width="12" height="12" fill="#e9b24a"/>
      <rect x="56" y="52" width="12" height="12" fill="#e9b24a"/>
    </g>
  </g>

  <!-- paper grain over everything -->
  <rect width="1600" height="900" filter="url(#grain)" fill="#000"/>
</svg>
