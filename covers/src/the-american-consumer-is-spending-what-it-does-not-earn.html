<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cover: the American consumer is spending what it does not earn</title>
<style>
	html, body { margin: 0; height: 100%; background: #1a1433; overflow: hidden; }
	canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<script>
	// Pixel art, as from an old console: a trolley piled far too high rolls through a town at dusk,
	// and the two meters at the top say what the scene is about. Drawn a pixel at a time on a
	// 320x180 canvas, which the page then shows large and unsmoothed.
	const g = document.getElementById("c").getContext("2d");
	let seed = 20261006;
	const r = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
	const px = (x, y, w, h, color) => { g.fillStyle = color; g.fillRect(Math.round(x), Math.round(y), w, h); };

	// The sky: bands of colour, dithered where one meets the next.
	const sky = ["#1a1433", "#2a1b4d", "#4a2462", "#7d2f6b", "#b8425f", "#e8734f", "#f7a857", "#fbd27a"];
	const band = 13;
	for (let y = 0; y < 112; y++) for (let x = 0; x < 320; x++) {
		const at = y / band, i = Math.min(sky.length - 1, Math.floor(at)), into = at - i;
		const next = into > 0.55 && ((x + y) % 2 === 0) && (into > 0.8 || (x % 4 === 0 && y % 2 === 0) || into > 0.68 && y % 2 === 0);
		px(x, y, 1, 1, sky[Math.min(sky.length - 1, i + (next ? 1 : 0))]);
	}
	// A low sun, and a few stars still out.
	for (let y = -17; y <= 17; y++) for (let x = -17; x <= 17; x++) if (x * x + y * y <= 290) px(236 + x, 96 + y, 1, 1, y > 8 && y % 3 === 0 ? "#f7a857" : "#fff1b8");
	for (let i = 0; i < 46; i++) px(r() * 320, r() * 44, 1, 1, r() < 0.3 ? "#ffffff" : "#b9a6e8");

	// Two rows of town: the far one flat, the near one with its windows lit.
	const town = (base, low, high, color, lit) => {
		for (let x = 0; x < 320; ) {
			const w = 9 + Math.floor(r() * 16), h = low + Math.floor(r() * (high - low));
			px(x, base - h, w, h, color);
			if (r() < 0.4) px(x + 2, base - h - 3, 3, 3, color);
			if (lit) for (let wy = base - h + 3; wy < base - 3; wy += 5) for (let wx = x + 2; wx < x + w - 2; wx += 4) if (r() < 0.42) px(wx, wy, 2, 2, r() < 0.8 ? "#ffd166" : "#ff8fa3");
			x += w + (r() < 0.3 ? 2 : 0);
		}
	};
	town(112, 14, 44, "#5a2a66", false);
	town(118, 10, 58, "#2a1a4a", true);

	// The street: a pavement, a kerb, a road with its line.
	px(0, 118, 320, 62, "#221638");
	px(0, 118, 320, 2, "#4a3570");
	px(0, 144, 320, 36, "#150e26");
	px(0, 143, 320, 1, "#3a2a5c");
	for (let x = 4; x < 320; x += 26) px(x, 163, 13, 2, "#6c5a96");
	for (let i = 0; i < 180; i++) px(r() * 320, 146 + r() * 34, 1, 1, "#1f1536");
	// Lamp posts, with their pools of light.
	for (const x of [38, 290]) {
		px(x, 78, 2, 42, "#0e0a1c"); px(x - 5, 76, 12, 2, "#0e0a1c"); px(x - 5, 78, 4, 2, "#ffe8a3");
		for (let k = 0; k < 9; k++) px(x - 8 - k, 120 + k * 2, 12 + k * 2, 2, k % 2 ? "#2b1d47" : "#32224f");
	}

	// The trolley, and what is piled on it.
	const X = 118, Y = 138;                                       // the trolley's basket: its top left
	const boxes = [                                               // x, y (up from the basket), w, h, colour, ribbon
		[2, 0, 22, 15, "#e63946", "#ffd166"], [25, 0, 20, 12, "#2a9d8f", "#f1faee"], [46, 0, 16, 18, "#f4a261", "#7d2f6b"],
		[5, 15, 17, 13, "#457b9d", "#ffd166"], [23, 12, 24, 16, "#ffd166", "#e63946"], [48, 18, 13, 11, "#b8425f", "#f1faee"],
		[9, 28, 21, 12, "#f1faee", "#2a9d8f"], [31, 28, 17, 14, "#e63946", "#f1faee"], [14, 40, 15, 13, "#2a9d8f", "#ffd166"],
		[30, 42, 19, 10, "#f4a261", "#457b9d"], [18, 53, 18, 12, "#457b9d", "#f1faee"], [24, 65, 13, 13, "#ffd166", "#b8425f"],
		[21, 78, 11, 9, "#e63946", "#ffd166"], [25, 87, 8, 8, "#2a9d8f", "#f1faee"],
	];
	boxes.forEach(([bx, by, w, h, color, ribbon], i) => {
		const lean = Math.round((by / 96) ** 2 * 9);                 // the pile leans the higher it goes
		const [x, y] = [X + bx + lean, Y - by - h];
		px(x, y, w, h, color);
		px(x, y, w, 1, "#ffffff55"); px(x + w - 2, y, 2, h, "#00000033"); px(x, y + h - 1, w, 1, "#00000033");
		px(x + Math.floor(w / 2) - 1, y, 2, h, ribbon);
		if (i % 2 === 0) px(x, y + Math.floor(h / 2) - 1, w, 2, ribbon);
	});
	// One has already gone over the side.
	px(X + 78, Y + 9, 12, 10, "#b8425f"); px(X + 83, Y + 9, 2, 10, "#ffd166"); px(X + 78, Y + 9, 12, 1, "#ffffff55");
	px(X + 72, Y - 8, 1, 3, "#ffffff"); px(X + 75, Y - 2, 1, 3, "#ffffff"); px(X + 70, Y + 2, 1, 2, "#ffffff");
	// The basket: a grid of wire over the lowest boxes.
	for (let y = 0; y < 22; y += 4) px(X - 1 + Math.floor(y / 5), Y - 1 + y, 66 - Math.floor(y / 5) * 2, 1, "#d8dbe8");
	for (let x = 0; x <= 64; x += 5) px(X + x, Y - 1, 1, 22, "#d8dbe8");
	px(X - 2, Y - 2, 68, 2, "#f4f5fa");
	// Its handle, its frame, its wheels.
	px(X - 13, Y - 9, 13, 2, "#f4f5fa"); px(X - 14, Y - 10, 3, 4, "#e63946"); px(X - 3, Y - 8, 2, 8, "#d8dbe8");
	px(X + 4, Y + 21, 58, 2, "#aab0c8"); px(X + 6, Y + 23, 2, 6, "#aab0c8"); px(X + 56, Y + 23, 2, 6, "#aab0c8");
	for (const wx of [X + 4, X + 54]) { px(wx, Y + 28, 6, 6, "#0e0a1c"); px(wx + 2, Y + 30, 2, 2, "#aab0c8"); }
	// Its shadow, and the dust it leaves behind.
	px(X - 2, Y + 34, 74, 2, "#0b0716");
	for (const [dx, dy] of [[-12, 30], [-18, 27], [-24, 31], [-9, 25]]) px(X + dx, Y + dy, 2, 2, "#6c5a96");

	// The two meters: what comes in, small and steady; what goes out, past the end of its bar.
	const meter = (y, icon, filled, color, over) => {
		px(12, y - 1, 126, 13, "#0e0a1ccc");
		icon(16, y + 1);
		for (let i = 0; i < 12; i++) px(32 + i * 8, y + 2, 6, 7, i < filled ? color : "#3a2a5c");
		if (over) for (let i = 0; i < 3; i++) px(140 + i * 8, y + 2, 6, 7, i % 2 ? "#ffffff" : color);
	};
	const coin = (x, y) => { px(x + 2, y, 5, 9, "#ffd166"); px(x, y + 2, 9, 5, "#ffd166"); px(x + 1, y + 1, 7, 7, "#ffd166"); px(x + 4, y + 2, 1, 5, "#b8860b"); px(x + 2, y + 1, 2, 1, "#fff1b8"); };
	const bag = (x, y) => { px(x + 1, y + 3, 7, 6, "#e63946"); px(x, y + 4, 9, 4, "#e63946"); px(x + 3, y, 3, 1, "#f1faee"); px(x + 2, y + 1, 1, 2, "#f1faee"); px(x + 6, y + 1, 1, 2, "#f1faee"); px(x + 1, y + 3, 7, 1, "#ff8fa3"); };
	meter(10, coin, 4, "#ffd166", false);
	meter(26, bag, 12, "#e63946", true);
</script>
</body>
</html>
